[project]
name = "auto-welearn"
version = "5.0.12"
description = "WeLearn 学习助手：多账号作业/学习时长自动化桌面工具"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PyQt5>=5.15.11",
    "requests>=2.32.5",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.uv]
required-environments = [
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py39"
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
# 只启用「能抓真 bug」的规则集，格式类交给 line-length
select = ["E4", "E7", "E9", "F", "I", "UP032", "B006", "B008", "B904"]
ignore = ["E501"]